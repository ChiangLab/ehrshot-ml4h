private_root: outputs/private/final/locked_four_task_m2_m3_v1
aggregate_root: reports/generated/final/locked_four_task_m2_m3_v1

embedding_model:
  repository: Qwen/Qwen3-Embedding-0.6B
  directory_name: Qwen3-Embedding-0.6B
  frozen: true
  normalize_embeddings_float32: true
  full_dimension: true
  batch_size: 4

m2:
  approach: single_pass_summary_embedding
  recursive: false
  source_history_policy: m1_content_matched_8192
  instruction_model: nvidia/Qwen3.6-35B-A3B-NVFP4
  api_base: http://10.45.177.17:8000/v1
  endpoint: /chat/completions
  on_premise_only: true
  prompt_version: m2_fidelity_v2_compact_structured
  prompt: >-
    Convert this ordered strictly pre-prediction record once into a compact structured summary.
    Output only supplied bracketed time-label lines followed by dash-prefixed fact lines; do not
    output headings, prose, explanations, or code definitions. Copy every clinical code exactly as
    supplied and never translate, expand, rename, or interpret a code. Exact duplicate source facts
    may already be compacted with occurrences=N; copy that supplied count exactly and never recount
    or increment it. Within each time block, combine remaining repetitions of the same
    code/source/unit into one fact, state occurrences=N, and list each distinct supplied numeric
    value exactly once in first-occurrence order as values=V1,V2.
    Preserve every supplied unit and nonnumeric value. State trend=increasing, trend=decreasing, or
    trend=stable only when directly supported by the supplied ordered numeric values; otherwise
    omit trend. Keep every supplied time label in exactly the supplied order, including falsified
    labels; never correct or reinterpret one. Do not infer a diagnosis, concept name, causal
    relationship, future event, outcome, or missing fact. Use only facts present in the input.
  decoding:
    temperature: 0.0
    top_p: 1.0
    seed: 20260815
    max_output_tokens: 2048
    chat_template_kwargs:
      enable_thinking: false
  execution:
    concurrent_requests: 4
    request_retries: 3
  reference_condition: C1_correct_compact_time
  fidelity_condition: C3_shuffled_earlier_time_labels
  fidelity_seed: 20260815
  sensitivity_conditions:
    - B1_latest_window_only
    - C0_order_only
    - C2_reversed_earlier_gaps
    - C3_shuffled_earlier_time_labels:seed=20260815
    - C3_shuffled_earlier_time_labels:seed=20260816
    - C3_shuffled_earlier_time_labels:seed=20260817
  fidelity:
    validation_histories: 40
    histories_per_task_condition: 5
    minimum_concept_retention: 0.90
    minimum_numeric_retention: 0.95
    minimum_unit_retention: 0.95
    minimum_recurrence_retention: 0.80
    minimum_trend_retention: 0.80
    minimum_time_label_retention: 0.95
    maximum_unsupported_fact_rate: 0.01
    maximum_contradictions: 0
    maximum_timing_repairs: 0
    maximum_format_violations: 0
    maximum_generation_failure_rate: 0.0

m3:
  approach: per_window_embedding_gru
  reference_condition: C1_correct_compact_time
  sensitivity_conditions:
    - B1_latest_window_only
    - C0_order_only
    - C2_reversed_earlier_gaps
    - C3_shuffled_earlier_time_labels:seed=20260815
    - C3_shuffled_earlier_time_labels:seed=20260816
    - C3_shuffled_earlier_time_labels:seed=20260817
  max_tokens_per_window: 512
  embedding_batch_size: 32
  max_recent_nonempty_windows: 64
  mean_pool_logistic_baseline: true
  projection_dimension: 256
  projection_seed: 20260819
  hidden_size: 128
  input_dropout: 0.1
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.01
  batch_size: 32
  maximum_epochs: 50
  early_stopping_patience: 5
  early_stopping_metric: validation_auroc
  training_seeds:
    - 20260815
    - 20260816
    - 20260817

evaluation:
  regularization_grid:
    - 0.01
    - 0.1
    - 1.0
    - 10.0
  logistic_seed: 20260815
  bootstrap_seed: 20260818
  bootstrap_replicates: 2000
  approach_selection:
    primary_metric: equal_weight_validation_macro_auroc
    minimum_margin: 0.005
    no_margin_priority:
      - M1
      - M2
      - M3
    second_tiebreaker: validation_log_loss

prohibitions:
  test_split: true
  test_predictions_or_performance: true
  external_summary_api: true
  recursive_summarization: true
  prompt_refinement_on_held_out_data: true
  m1_artifact_mutation: true
  serializer_mutation: true
  cohort_mutation: true

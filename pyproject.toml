[build-system]
requires = ["flit_core>=3.11,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "temporal-ehr-ml4h"
version = "0.1.0"
description = "Privacy-safe EHRSHOT validation and temporal representation experiments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Temporal EHR project contributors" }]
dependencies = [
  "duckdb>=1.3,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2,<3",
  "pyarrow>=18,<24",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "joblib>=1.4,<2",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
]
notebook = [
  "ipykernel>=6.29,<8",
  "ipywidgets>=8.1,<9",
  "joblib>=1.4,<2",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
]
model = [
  "accelerate>=1,<2",
  "huggingface-hub>=0.34,<2",
  "sentence-transformers>=2.7,<6",
  "transformers>=4.51,<6",
]

[project.scripts]
temporal-ehr = "temporal_ehr.cli:main"

[tool.flit.module]
name = "temporal_ehr"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".codex_artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
